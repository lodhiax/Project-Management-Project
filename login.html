<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PMO Suite</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* ------------------------------------------------------------
     Demo-only sign-in gate. NOT real authentication: there is no
     backend and no user database — just one fixed demo credential
     (PMO / Suite) checked client-side, purely so a visitor sees a
     login step before reaching the suite. State lives in
     sessionStorage (ppsDemoAuthed) so it's asked again per browser
     session/tab, and is separate from the app's own PPS data keys.
     ------------------------------------------------------------ */
  body { max-width: 420px; margin: 8vh auto; padding: 0; border: none; box-shadow: none; background: transparent; }
  .login-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 34px 32px 28px; box-shadow: 0 10px 34px rgba(27,39,51,0.10), 0 2px 8px rgba(27,39,51,0.06);
  }
  .login-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
  .login-brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--stage-active); }
  .login-brand span { font-size: 12.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-soft); }
  .login-card h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
  .login-sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 22px; line-height: 1.5; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px; }
  .login-field input {
    width: 100%; padding: 9px 11px; font-size: 13px; font-family: inherit; color: var(--ink);
    background: var(--fill); border: 1px solid var(--line); border-radius: 5px; outline: none;
  }
  .login-field input:focus { border-color: var(--link); background: #fff; }
  .login-field input.invalid { border-color: var(--danger); }
  .login-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 20px; }
  .login-remember { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .login-submit { width: 100%; text-align: center; justify-content: center; }
  .login-error { font-size: 12px; color: var(--danger); margin: -8px 0 14px; display: none; }
  .login-error.show { display: block; }
  .login-demo-note {
    margin-top: 20px; padding: 10px 12px; background: var(--ribbon); border: 1px solid var(--line);
    border-radius: 6px; font-size: 11.5px; color: var(--ink-soft); line-height: 1.6;
  }
  .login-demo-note b { color: var(--ink); }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand"><span class="dot"></span><span>PMO Suite</span></div>
  <h1>Sign in to continue</h1>
  <p class="login-sub">Enter your credentials to continue.</p>

  <form id="loginForm" novalidate>
    <div class="login-field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="e.g. j.rivera">
    </div>
    <div class="login-field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    </div>
    <div class="login-error" id="loginError">Incorrect username or password.</div>
    <div class="login-row">
      <label class="login-remember"><input type="checkbox" id="loginRemember"> Keep me signed in on this device</label>
    </div>
    <button type="submit" class="pps-btn login-submit">Sign in</button>
  </form>

  <div class="login-demo-note">
    <b>Demo gate, not real security.</b> 
  </div>
</div>

<script>
(function () {
  var form = document.getElementById("loginForm");
  var userEl = document.getElementById("loginUser");
  var passEl = document.getElementById("loginPass");
  var err = document.getElementById("loginError");
  var remember = document.getElementById("loginRemember");

  // Where to go after signing in: preserves a deep link if one was
  // captured by the guard script (e.g. ?next=scorecard.html).
  function nextPage() {
    var params = new URLSearchParams(location.search);
    var next = params.get("next");
    return next && !/^https?:|:\/\//i.test(next) ? next : "index.html";
  }

  // Fixed demo credential — not a real account system, just a single
  // client-side check so a visitor sees a login step before the suite.
  var DEMO_USER = "PMO";
  var DEMO_PASS = "Suite";

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = userEl.value.trim(), p = passEl.value;
    var ok = (u === DEMO_USER && p === DEMO_PASS);
    userEl.classList.toggle("invalid", !ok);
    passEl.classList.toggle("invalid", !ok);
    if (!ok) { err.classList.add("show"); return; }
    err.classList.remove("show");

    var record = { user: u, at: new Date().toISOString() };
    try {
      sessionStorage.setItem("ppsDemoAuthed", JSON.stringify(record));
      if (remember.checked) localStorage.setItem("ppsDemoAuthed", JSON.stringify(record));
    } catch (ex) { /* storage unavailable — proceed anyway, this is a demo gate */ }

    location.href = nextPage();
  });
})();
</script>

</body>
</html>
