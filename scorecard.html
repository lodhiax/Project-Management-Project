<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Scorecard</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  :root {
    --border: #3d4b5c;
    --grey-bg: #eef1f5;
    --placeholder: #8b96a3;
    --required: #c0392b;
    --accent: #5c7d99;
    --accent-light: #e3e9f0;
    --page-bg: #f8f9fb;
    --header-dark: #33465a;
    --panel-head: #d9c48a;
    --highlight: #f6efcf;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    background: var(--page-bg);
    margin: 20px;
    padding: 24px 28px 32px;
    font-size: 13px;
    color: #1a1a1a;
    border: 1px solid #e0e5eb;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(61, 75, 92, 0.08);
  }

  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid var(--border); padding: 6px 8px; vertical-align: top; text-align: left; }
  .center { text-align: center; }
  .status-cell { text-align: center; vertical-align: middle; }

  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }
  .dot-black { background: #33465a; }
  .dot-grey  { background: #b7c0cb; }
  .dot-green { background: #4d7a5c; }
  .dot-yellow{ background: #c99a3d; }
  .dot-red   { background: var(--required); }
  .dot-purple{ background: #6a5a8c; }
  .dot-blue  { background: var(--accent); }

  table.sc-head { border: 2px solid var(--border); }
  .sc-title { background: var(--header-dark); color: #fff; font-size: 24px; font-weight: bold; text-align: center; vertical-align: middle; }
  .sc-legend { background: #fff; padding: 4px 6px; width: 240px; }
  .legend-table { width: 100%; border-collapse: collapse; }
  .legend-table td { border: none; padding: 2px 6px; font-size: 12.5px; color: var(--header-dark); }
  .legend-table td.ll { text-align: right; white-space: nowrap; }
  .legend-table td.ld { text-align: center; width: 26px; }

  .rpt-label { background: var(--header-dark); color: #fff; font-weight: bold; width: 15%; }
  .rpt-val { background: var(--accent-light); color: var(--header-dark); font-weight: bold; }

  .sc-mid { display: flex; gap: 0; align-items: stretch; }
  .sc-meta { flex: 1 1 65%; }
  .sc-meta table { border: 2px solid var(--border); border-right: 1px solid var(--border); height: 100%; }
  .sc-panels { flex: 0 0 35%; display: flex; flex-direction: column; }
  .sc-panels table { border: 2px solid var(--border); border-left: 1px solid var(--border); }
  .sc-panels table.fin { border-top: 1px solid var(--border); flex: 1 1 auto; }

  .lbl { background: #fff; font-weight: 600; width: 26%; }
  .val { background: var(--grey-bg); }
  .val-hl { background: var(--highlight); font-weight: bold; }
  .panel-head td { background: var(--panel-head); color: #4a3d16; font-weight: bold; text-align: center; }
  .panel-lbl { background: #fff; font-weight: 600; }
  .panel-val { background: var(--grey-bg); text-align: center; }

  .sec-head td { background: var(--header-dark); color: #fff; font-weight: bold; padding: 4px 8px; }
  .sec-head .note { font-weight: normal; font-style: italic; font-size: 12px; color: #cdd6e0; }
  .col-head td { background: var(--grey-bg); color: var(--header-dark); font-weight: bold; text-align: center; }
  table.section { border: 2px solid var(--border); border-top: none; }
  table.section.first { border-top: 2px solid var(--border); }

  .derived { font-size: 11px; color: var(--accent); font-weight: normal; }
</style>
</head>
<body>

<nav class="pps-nav">
  <span class="pps-brand">PMO SUITE</span>
  <a href="index.html">Home</a>
  <a href="intake-form.html">Intake Form</a>
  <a href="intake-report.html">Intake Report</a>
  <a href="portfolio-review.html">Portfolio Review</a>
  <a href="scorecard.html" class="active">Scorecard</a>
</nav>

<div class="pps-toolbar" style="justify-content:space-between;align-items:center;">
  <span class="pps-note" style="margin:0;">
    Header, manager, dates, phase, % complete and schedule status are pulled live from the Weekly Portfolio Review.
  </span>
  <label style="font-weight:600;color:#33465a;">
    Project:&nbsp;
    <select id="projectPicker" class="pps-select"></select>
  </label>
</div>

<script src="assets/js/store.js"></script>

<div id="scorecard"><!-- rendered by JS --></div>

<script>
  (function () {
    var esc = PPS.esc;
    var picker = document.getElementById("projectPicker");
    var mount  = document.getElementById("scorecard");

    function dot(statusKey) {
      var st = PPS.portfolioStatus(statusKey);
      return '<span class="dot ' + st.dot + '" title="' + esc(st.label) + '"></span>';
    }

    function buildPicker() {
      var projects = PPS.getPortfolio();
      picker.innerHTML = projects.map(function (p) {
        return '<option value="' + esc(p.code) + '">' + esc(p.name) + ' (' + esc(p.code) + ')</option>';
      }).join("");
    }

    function milestoneRows(detail) {
      if (!detail || !detail.milestones || !detail.milestones.length) {
        return '<tr><td colspan="6" class="pps-empty">No detailed milestones captured for this project yet.</td></tr>';
      }
      return detail.milestones.map(function (m) {
        return '<tr>' +
          '<td>' + esc(m.phase) + '</td>' +
          '<td>' + esc(m.name) + '</td>' +
          '<td class="center">' + esc(m.start) + '</td>' +
          '<td class="center">' + esc(m.planned) + '</td>' +
          '<td class="center">' + (m.actual ? esc(m.actual) : "&nbsp;") + '</td>' +
          '<td class="status-cell">' + dot(m.status) + '</td>' +
        '</tr>';
      }).join("");
    }

    function riskRows(detail) {
      if (!detail || !detail.risks || !detail.risks.length) {
        return '<tr><td colspan="5" class="pps-empty">No risks logged for this project.</td></tr>';
      }
      return detail.risks.map(function (r, i) {
        return '<tr>' +
          '<td class="center">' + (i + 1) + '</td>' +
          '<td>' + esc(r.desc) + '</td>' +
          '<td>' + esc(r.owner) + '</td>' +
          '<td class="center">' + esc(r.severity) + '</td>' +
          '<td class="center">' + esc(r.finalStatus) + '</td>' +
        '</tr>';
      }).join("");
    }

    function issueRows(detail) {
      if (!detail || !detail.issues || !detail.issues.length) {
        return '<tr><td colspan="5" class="pps-empty">No open issues requiring management intervention.</td></tr>';
      }
      return detail.issues.map(function (r, i) {
        return '<tr>' +
          '<td class="center">' + (i + 1) + '</td>' +
          '<td>' + esc(r.desc) + '</td>' +
          '<td>' + esc(r.owner) + '</td>' +
          '<td class="center">' + esc(r.due) + '</td>' +
          '<td class="status-cell">' + dot(r.status) + '</td>' +
        '</tr>';
      }).join("");
    }

    function keyUpdateRows(detail, project) {
      var updates = (detail && detail.keyUpdates && detail.keyUpdates.length)
        ? detail.keyUpdates
        : (project.progress ? [project.progress] : []);
      if (!updates.length) {
        return '<tr><td colspan="2" class="pps-empty">No updates recorded this cycle.</td></tr>';
      }
      return updates.map(function (u, i) {
        return '<tr><td class="center">' + (i + 1) + '</td><td>' + esc(u) + '</td></tr>';
      }).join("");
    }

    function crRows(detail) {
      if (!detail || !detail.changeRequestDetails || !detail.changeRequestDetails.length) {
        return '<tr><td colspan="5" class="pps-empty">No change requests raised this cycle.</td></tr>';
      }
      return detail.changeRequestDetails.map(function (c, i) {
        return '<tr>' +
          '<td class="center">' + (i + 1) + '</td>' +
          '<td>' + esc(c.desc) + '</td>' +
          '<td>' + esc(c.raisedBy) + '</td>' +
          '<td class="center">' + esc(c.date) + '</td>' +
          '<td class="status-cell">' + dot(c.status) + '</td>' +
        '</tr>';
      }).join("");
    }

    function render(code) {
      var p = PPS.getProject(code);
      if (!p) { mount.innerHTML = '<p class="pps-empty">Project not found.</p>'; return; }
      var d = PPS.getScorecardDetail(code); // may be null for non-flagship projects

      // Values sourced from the portfolio (live) vs. the scorecard detail seed.
      var scopeStatus  = d && d.scopeStatus  ? d.scopeStatus  : p.status;
      var budgetStatus = d && d.budgetStatus ? d.budgetStatus : p.status;
      var sponsor  = (d && d.sponsor)  || "\u2014";
      var category = (d && d.category) || "\u2014";
      var objective = (d && d.objective) ||
        ([p.progress, p.remarks].filter(Boolean).join(" ") || "No objective statement captured for this project yet.");

      var cr  = (d && d.changeRequests) || { approved: 0, rejected: 0, lastCycle: 0 };
      var fin = (d && d.financials) || { budgeted: "\u2014", spent: "\u2014", etc: "\u2014" };

      mount.innerHTML =
      '<table class="sc-head">' +
        '<colgroup><col style="width:15%"><col style="width:20%"><col style="width:15%"><col style="width:16%"><col style="width:34%"></colgroup>' +
        '<tr>' +
          '<td class="sc-title" colspan="4">Weekly Scorecard</td>' +
          '<td class="sc-legend" rowspan="2">' +
            '<table class="legend-table">' +
              '<tr><td class="ll">Not Started</td><td class="ld"><span class="dot dot-black"></span></td></tr>' +
              '<tr><td class="ll">On Track</td><td class="ld"><span class="dot dot-green"></span></td></tr>' +
              '<tr><td class="ll">On Hold</td><td class="ld"><span class="dot dot-purple"></span></td></tr>' +
              '<tr><td class="ll">At Risk</td><td class="ld"><span class="dot dot-yellow"></span></td></tr>' +
              '<tr><td class="ll">Delayed</td><td class="ld"><span class="dot dot-red"></span></td></tr>' +
              '<tr><td class="ll">Completed</td><td class="ld"><span class="dot dot-blue"></span></td></tr>' +
            '</table>' +
          '</td>' +
        '</tr>' +
        '<tr><td class="rpt-label">Report Date</td><td class="rpt-val" colspan="3">' + PPS.today() + '</td></tr>' +
      '</table>' +

      '<div class="sc-mid">' +
        '<div class="sc-meta"><table>' +
          '<colgroup><col style="width:26%"><col style="width:32%"><col style="width:20%"><col style="width:22%"></colgroup>' +
          '<tr>' +
            '<td class="lbl">Project Name</td><td class="val-hl">' + esc(p.name) + '</td>' +
            '<td class="lbl">Project Code</td><td class="val">' + esc(p.code) + '</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Sponsor Name &amp; Title</td><td class="val">' + esc(sponsor) + '</td>' +
            '<td class="lbl">Project Manager</td><td class="val">' + esc(p.pm) + '</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Scope Status</td><td class="val status-cell">' + dot(scopeStatus) + '</td>' +
            '<td class="lbl">Category</td><td class="val">' + esc(category) + '</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Schedule Status</td><td class="val status-cell">' + dot(p.status) + '</td>' +
            '<td class="lbl">Start Date</td><td class="val">' + esc(p.start) + '</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Budget Status</td><td class="val status-cell">' + dot(budgetStatus) + '</td>' +
            '<td class="lbl">Planned End Date</td><td class="val">' + esc(p.end) + '</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Phase</td><td class="val">' + esc(p.phase) + '</td>' +
            '<td class="lbl">% Complete</td><td class="val">' + esc(p.percent) + '%</td>' +
          '</tr>' +
          '<tr>' +
            '<td class="lbl">Objective</td><td colspan="3">' + esc(objective) + '</td>' +
          '</tr>' +
        '</table></div>' +

        '<div class="sc-panels">' +
          '<table class="cr"><colgroup><col style="width:62%"><col style="width:38%"></colgroup>' +
            '<tr class="panel-head"><td colspan="2">Change Requests Received</td></tr>' +
            '<tr><td class="panel-lbl">Approved / Rejected</td><td class="panel-val">' + esc(cr.approved) + ' / ' + esc(cr.rejected) + '</td></tr>' +
            '<tr><td class="panel-lbl">Received in last cycle</td><td class="panel-val">' + esc(cr.lastCycle) + '</td></tr>' +
          '</table>' +
          '<table class="fin"><colgroup><col style="width:62%"><col style="width:38%"></colgroup>' +
            '<tr class="panel-head"><td colspan="2">Financials (in USD)</td></tr>' +
            '<tr><td class="panel-lbl">Budgeted</td><td class="panel-val">' + esc(fin.budgeted) + '</td></tr>' +
            '<tr><td class="panel-lbl">Spent to date</td><td class="panel-val">' + esc(fin.spent) + '</td></tr>' +
            '<tr><td class="panel-lbl">Estimate to Complete</td><td class="panel-val">' + esc(fin.etc) + '</td></tr>' +
          '</table>' +
        '</div>' +
      '</div>' +

      // Milestones
      '<table class="section first">' +
        '<colgroup><col style="width:13%"><col style="width:35%"><col style="width:12%"><col style="width:13%"><col style="width:13%"><col style="width:14%"></colgroup>' +
        '<tr class="col-head"><td>Phase</td><td>Key Milestones</td><td>Start</td><td>Planned Finish</td><td>Actual Finish</td><td>Status</td></tr>' +
        milestoneRows(d) +
      '</table>' +

      // Risks
      '<table class="section">' +
        '<colgroup><col style="width:7%"><col style="width:52%"><col style="width:17%"><col style="width:12%"><col style="width:12%"></colgroup>' +
        '<tr class="sec-head"><td colspan="5">Risks</td></tr>' +
        '<tr class="col-head"><td>Sr #</td><td>Description</td><td>Owner</td><td>Severity</td><td>Final Status</td></tr>' +
        riskRows(d) +
      '</table>' +

      // Issues
      '<table class="section">' +
        '<colgroup><col style="width:7%"><col style="width:52%"><col style="width:17%"><col style="width:12%"><col style="width:12%"></colgroup>' +
        '<tr class="sec-head"><td colspan="5">Issues <span class="note">(requires management intervention)</span></td></tr>' +
        '<tr class="col-head"><td>Sr #</td><td>Description</td><td>Owner</td><td>Due Date</td><td>Status</td></tr>' +
        issueRows(d) +
      '</table>' +

      // Key Updates
      '<table class="section">' +
        '<colgroup><col style="width:7%"><col style="width:93%"></colgroup>' +
        '<tr class="sec-head"><td colspan="2">Key Updates <span class="note">(current cycle)</span></td></tr>' +
        '<tr class="col-head"><td>Sr #</td><td>Description</td></tr>' +
        keyUpdateRows(d, p) +
      '</table>' +

      // Change Request Details
      '<table class="section">' +
        '<colgroup><col style="width:7%"><col style="width:52%"><col style="width:17%"><col style="width:12%"><col style="width:12%"></colgroup>' +
        '<tr class="sec-head"><td colspan="5">Change Request Details <span class="note">(current cycle)</span></td></tr>' +
        '<tr class="col-head"><td>Sr #</td><td>Description</td><td>Raised By</td><td>Date</td><td>Status</td></tr>' +
        crRows(d) +
      '</table>';
    }

    buildPicker();
    render(picker.value);
    picker.addEventListener("change", function () { render(picker.value); });
    // Live link: if the portfolio changes in another tab, refresh the scorecard.
    window.addEventListener("storage", function (e) {
      if (e.key === PPS.KEYS.portfolio) { buildPicker(); render(picker.value); }
    });
  })();
</script>

</body>
</html>
